spring.application.name=medistock-backend-test

# Use in-memory H2 database for local testing
spring.datasource.url=jdbc:h2:mem:medistock_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate in-memory schema
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
